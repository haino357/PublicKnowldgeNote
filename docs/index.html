<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="公開HTMLコンテンツの一覧">
  <title>Public Knowledge Note | Web Contents</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #667085;
      --paper: #f7f4ee;
      --card: #fffdf9;
      --line: #ded8cc;
      --accent: #216b78;
      --accent-soft: #e8f4f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    header { margin-bottom: 40px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .lead {
      max-width: 660px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      min-height: 220px;
      padding: 28px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 14px 36px rgba(31, 42, 55, .08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 44px rgba(31, 42, 55, .13);
      outline: none;
    }

    .tag {
      display: inline-block;
      padding: 5px 10px;
      color: var(--accent);
      border-radius: 999px;
      background: var(--accent-soft);
      font-size: .76rem;
      font-weight: 800;
    }

    h2 { margin: 22px 0 8px; font-size: 1.35rem; }
    .card p { margin: 0; color: var(--muted); }
    .arrow { display: inline-block; margin-top: 20px; color: var(--accent); font-weight: 800; }

    footer {
      margin-top: 56px;
      padding-top: 20px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: .88rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Public Knowledge Note</p>
      <h1>Web Contents</h1>
      <p class="lead">知識や比較結果を、ブラウザで読みやすい形にまとめた公開コンテンツです。</p>
    </header>

    <section class="grid" aria-label="公開コンテンツ一覧">
      <a class="card" href="./camera-guide/">
        <span class="tag">CAMERA</span>
        <h2>初心者向けカメラ選びガイド</h2>
        <p>コンデジ、ミラーレス、一眼レフ、動画向けカメラの特徴と選び方を比較します。</p>
        <span class="arrow">ガイドを見る →</span>
      </a>
    </section>

    <footer>© Public Knowledge Note</footer>
  </main>
</body>
</html>
